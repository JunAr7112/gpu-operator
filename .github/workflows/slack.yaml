  dm-user:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on manual dispatch or the Mon/Wed schedule.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * 1,3' }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      # Recipient's Slack member ID (e.g. U0123456789), stored as a secret
      SLACK_DM_USER_ID: ${{ secrets.SLACK_DM_USER_ID }}

    steps:
      - name: Find stale uncommented issues
        id: stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Issues created on or before this timestamp are >= 72h old.
          cutoff=$(date -u -d "-72 hours" +%Y-%m-%dT%H:%M:%SZ)

          # Exclude any issue a maintainer has already commented on.
          exclude=""
          for m in $MAINTAINERS; do
            exclude="$exclude -commenter:$m"
          done

          blocks=$(jq -n \
            '[{type:"header",text:{type:"plain_text",text:"⚠️ Open issues >72h old with no maintainer comment"}}]')
          found=0

          for repo in $REPOS; do
            items=$(gh api -X GET search/issues \
              -f q="repo:$repo is:issue is:open created:<=$cutoff$exclude" \
              -F per_page=100 \
              --jq '.items')

            n=$(jq 'length' <<< "$items")
            [ "$n" -eq 0 ] && continue
            found=$((found + n))

            list=$(jq -r '[.[] | "• <\(.html_url)|#\(.number) \(.title)>"] | join("\n")' <<< "$items")
            section="*$repo* ($n)
$list"
            blocks=$(jq --arg t "$section" '. + [{type:"section",text:{type:"mrkdwn",text:$t}}]' <<< "$blocks")
          done

          {
            echo "found=$found"
            echo "blocks<<EOF"
            echo "$blocks"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: DM the user about stale issues
        if: ${{ env.SLACK_BOT_TOKEN != '' && env.SLACK_DM_USER_ID != '' && steps.stale.outputs.found != '0' }}
        uses: slackapi/slack-github-action@v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_DM_USER_ID }}",
              "text": "Open issues over 72h old with no maintainer comment",
              "blocks": ${{ steps.stale.outputs.blocks }}
            }
