name: Slack issue digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1-5"   # digest: 15:00 UTC on weekdays
    - cron: "0 15 * * 1,3"   # dm-user: 15:00 UTC on Mon and Wed

permissions: {}

env:
  # Space-separated list of repos to report on (owner/name)
  REPOS: "NVIDIA/gpu-operator NVIDIA/gpu-driver-container NVIDIA/mig-parted NVIDIA/go-nvlib NVIDIA/go-nvml NVIDIA/k8s-driver-manager NVIDIA/libnvidia-container NVIDIA/nvidia-container-toolkit NVIDIA/k8s-device-plugin NVIDIA/go-gpuallocator"
  # Space-separated GitHub logins. An issue is NOT flagged if any of these
  # users has commented on it at least once.
  MAINTAINERS: "rajathagasthya"

